services:
  - type: web
    name: musematrix-media-api
    env: node
    plan: free
    buildCommand: python3 -m pip install --upgrade "yt-dlp[default,curl-cffi]"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EXTRACTOR_TIMEOUT_MS
        value: "20000"
      - key: PARSE_CACHE_TTL_MS
        value: "90000"
      - key: DOWNLOAD_TIMEOUT_MS
        value: "30000"
      - key: CORS_ORIGIN
        value: "*"
      - key: YTDLP_COOKIES_TEXT
        sync: false
